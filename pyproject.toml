[project]
name = "kopy"
version = "0.1.0"
description = "Copy local directories into Kubernetes PVC targets"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "clypi>=1.2.13",
  "iterfzf>=1.8.0.62.0",
  "kubernetes>=31.0.0",
  "rich>=13.9.0",
  "truststore>=0.10.4",
]

[project.scripts]
kopy = "kopy.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"
